[package]
name = "gg"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "像 man 一样查询你自己的命令笔记 / Query your own command notes like man"
license = "MIT"
repository = "https://github.com/wmjim/gg"
readme = "README.md"
keywords = ["cli", "notes", "man", "markdown", "cheatsheet"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
humantime = "2.4.0"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.1"
strsim = "0.11.1"
tempfile = "3.27.0"
toml = "1.1.6"
which = "8.0.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
