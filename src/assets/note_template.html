<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>{{command}} · gg</title>
    <style>
        /* 颜色只在下面两个主题块里定义：任何规则内的字面量颜色都是 bug，
           会绕开主题切换（深色模式下变成一块亮斑）。有测试守着这条约定。 */
        :root {
            --bg: #0f1112;
            --surface: #16191a;
            --surface-2: #1d2122;
            --fg: #d8d5cf;
            --fg-muted: #8e8a82;
            --accent: #ffb454;
            --accent-dim: #c8893a;
            --link: #7fb8d8;
            --rule: #2b2f30;
            --rule-strong: #3c4244;
            --rail-glow: rgba(255, 180, 84, 0.07);
            --grid-line: rgba(255, 255, 255, 0.022);
            --shadow: rgba(0, 0, 0, 0.34);
            --shadow-soft: rgba(0, 0, 0, 0.18);
            --zebra: rgba(255, 255, 255, 0.016);
            --hover: rgba(255, 180, 84, 0.06);
            /* 代码高亮：只用 3 个新色相，其余复用已有变量，
               整体维持在「琥珀 + 少量冷色」的克制范围内 */
            --tok-str: #a8cd8f;
            --tok-var: #7cc9c1;
            --tok-kw: #cba6dc;
            --tok-num: #c8893a;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f7f4ed;
                --surface: #efeade;
                --surface-2: #e6e0d1;
                --fg: #23211d;
                --fg-muted: #66625a;
                --accent: #8a4b00;
                --accent-dim: #a9660f;
                --link: #17587c;
                --rule: #d9d2c3;
                --rule-strong: #c2b9a6;
                --rail-glow: rgba(138, 75, 0, 0.06);
                --grid-line: rgba(35, 33, 29, 0.035);
                --shadow: rgba(60, 50, 30, 0.10);
                --shadow-soft: rgba(60, 50, 30, 0.06);
                --zebra: rgba(35, 33, 29, 0.022);
                --hover: rgba(138, 75, 0, 0.07);
                --tok-str: #3d6b26;
                --tok-var: #0e615d;
                --tok-kw: #7a3a8c;
                --tok-num: #7a4406;
            }
        }

        * {
            box-sizing: border-box;
        }

        :root {
            /* 全部为系统自带字体，不请求任何 webfont：
               本地 CLI 打开临时文件，离线可用、零延迟、不外泄请求。
               Maple Mono 自带 CJK 字面，因此中英混排基线一致。 */
            --font-mono: "Maple Mono Normal NL NF CN", "Maple Mono",
                "LXGW WenKai Mono", "Noto Sans Mono CJK SC",
                ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                "DejaVu Sans Mono", monospace;
            --font-display: "HarmonyOS Sans Condensed", "Archivo Narrow",
                "Liberation Sans Narrow", "DejaVu Sans Condensed",
                "Noto Sans CJK SC", system-ui, sans-serif;
            --rail-w: 8.5rem;
            --measure: 66ch;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: clamp(1.5rem, 3.5vw, 3.25rem) clamp(1rem, 3.5vw, 3rem);
            display: grid;
            grid-template-columns: var(--rail-w) minmax(0, 1fr);
            gap: 0 clamp(1.5rem, 3.5vw, 3.5rem);
            align-items: start;
            background-color: var(--bg);
            /* 工程纸底纹 + 书脊侧的一束柔光，避免大片纯色 */
            background-image:
                radial-gradient(60rem 24rem at 0% 0%, var(--rail-glow), transparent 70%),
                repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 2rem),
                repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 2rem);
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 15px;
            line-height: 1.75;
            font-variant-ligatures: none;
            -webkit-font-smoothing: antialiased;
            overflow-wrap: anywhere;
        }

        /* ---------- 书脊栏 ---------- */
        .rail {
            position: sticky;
            top: clamp(1.5rem, 3.5vw, 3.25rem);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1rem;
            min-height: 14rem;
            padding-right: 1rem;
            border-right: 1px solid var(--rule);
        }
        .rail__brand {
            font-family: var(--font-display);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .rail__cmd {
            /* 竖排像手册书脊上的书名 */
            writing-mode: vertical-rl;
            text-orientation: mixed;
            max-height: 60vh;
            overflow: hidden;
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: var(--fg-muted);
        }
        .rail__meta {
            margin-top: auto;
            font-size: 0.66rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--fg-muted);
            opacity: 0.75;
        }

        /* ---------- 正文版心 ---------- */
        .sheet {
            max-width: var(--measure);
            min-width: 0;
            counter-reset: section;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-mono);
            font-weight: 700;
            line-height: 1.3;
            color: var(--fg);
            margin: 2.4em 0 0.7em;
            text-wrap: balance;
        }
        h1 {
            margin-top: 0;
            font-size: 1.72rem;
            letter-spacing: -0.012em;
        }
        h1::before {
            content: "❯ ";
            color: var(--accent);
        }
        h2 {
            counter-increment: section;
            font-size: 1.06rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding-bottom: 0.45em;
            border-bottom: 1px solid var(--rule);
        }
        h2::before {
            /* 纯 CSS 章节编号，手册式目录感 */
            content: counter(section, decimal-leading-zero);
            margin-right: 0.7em;
            font-family: var(--font-display);
            font-size: 0.86em;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--accent);
        }
        h3 { font-size: 0.98rem; letter-spacing: 0.01em; }
        h3::before {
            content: "▍";
            margin-right: 0.45em;
            color: var(--accent-dim);
        }
        h4 { font-size: 0.92rem; color: var(--fg-muted); }
        h5 { font-size: 0.86rem; color: var(--fg-muted); font-weight: 600; }
        h6 {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--fg-muted);
        }

        p, blockquote, ul, ol, table, pre {
            margin: 0.9rem 0;
        }

        a {
            color: var(--link);
            text-decoration: none;
            border-bottom: 1px solid var(--rule-strong);
            transition: border-bottom-color 0.18s ease, color 0.18s ease;
        }
        a:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        strong { color: var(--fg); font-weight: 700; }
        em { font-style: italic; color: var(--fg); }
        del { color: var(--fg-muted); text-decoration-thickness: 1px; }

        /* ---------- 参数列表 ---------- */
        ul, ol {
            padding-left: 1.35rem;
        }
        ul {
            list-style: none;
            padding-left: 0;
        }
        ul > li {
            position: relative;
            padding-left: 1.5rem;
        }
        ul > li::before {
            content: "▸";
            position: absolute;
            left: 0.15rem;
            color: var(--accent-dim);
        }
        ol > li::marker {
            color: var(--accent-dim);
            font-variant-numeric: tabular-nums;
        }
        li + li {
            margin-top: 0.28rem;
        }
        li > p {
            margin: 0.25rem 0;
        }
        /* pulldown-cmark 不给任务列表项加类名，选择器只能按实际产出
           （li 内直接包着 checkbox）来写；不支持 :has() 的浏览器会整条
           规则失效，退化为项目符号 + 复选框，不会更劣。 */
        li:has(input[type="checkbox"]) {
            list-style: none;
            padding-left: 1.6rem;
        }
        li:has(input[type="checkbox"])::before {
            content: "";
        }
        li:has(input[type="checkbox"]) > input[type="checkbox"] {
            position: absolute;
            left: 0.1rem;
            top: 0.45em;
            margin: 0;
            accent-color: var(--accent);
        }

        /* ---------- 终端窗口式代码块 ---------- */
        pre {
            position: relative;
            background-color: var(--surface);
            border: 1px solid var(--rule);
            border-radius: 10px;
            padding: 2.7rem 1.15rem 1.05rem;
            overflow-x: auto;
            line-height: 1.65;
            box-shadow: 0 1px 2px var(--shadow-soft), 0 12px 32px -18px var(--shadow);
        }
        pre::before {
            /* 标题栏 */
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 2.1rem;
            border-bottom: 1px solid var(--rule);
            background-color: var(--surface-2);
            border-radius: 9px 9px 0 0;
        }
        pre::after {
            /* 三个窗口圆点 */
            content: "";
            position: absolute;
            top: 0.78rem;
            left: 1.1rem;
            width: 0.44rem;
            height: 0.44rem;
            border-radius: 50%;
            background-color: var(--rule-strong);
            box-shadow: 0.78rem 0 0 var(--rule-strong), 1.56rem 0 0 var(--rule-strong);
        }
        pre code {
            background: none;
            border: 0;
            padding: 0;
            color: var(--fg);
            font-size: 0.88rem;
            white-space: pre;
        }
        /* 高亮 token。服务端分词产出（见 utils/syntax.rs），页面里没有 JS。
           配色只分 5 组语义：提示符/选项最醒目（琥珀）、命令用正文色加粗、
           字符串绿、变量青、关键字紫，注释与操作符压到次级灰。 */
        .tok-prompt,
        .tok-opt {
            color: var(--accent);
        }
        .tok-cmd {
            color: var(--fg);
            font-weight: 600;
        }
        .tok-str {
            color: var(--tok-str);
        }
        .tok-var {
            color: var(--tok-var);
        }
        .tok-kw {
            color: var(--tok-kw);
        }
        .tok-num {
            color: var(--tok-num);
        }
        .tok-comment,
        .tok-op {
            color: var(--fg-muted);
        }

        /* ---------- 行内代码 = 参数芯片 ---------- */
        :not(pre) > code {
            padding: 0.08em 0.4em;
            border: 1px solid var(--rule);
            border-radius: 4px;
            background-color: var(--surface-2);
            color: var(--accent);
            font-size: 0.9em;
        }

        /* ---------- 表格 = 规格表 ---------- */
        table {
            width: 100%;
            border-collapse: collapse;
            font-variant-numeric: tabular-nums;
            font-size: 0.9rem;
        }
        thead th {
            padding: 0.62rem 0.85rem;
            background-color: var(--surface-2);
            border-bottom: 1px solid var(--rule-strong);
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-align: left;
            color: var(--fg-muted);
        }
        tbody td {
            padding: 0.58rem 0.85rem;
            border-bottom: 1px solid var(--rule);
            vertical-align: top;
        }
        tbody tr:nth-child(2n) {
            background-color: var(--zebra);
        }
        tbody tr:hover {
            background-color: var(--hover);
        }
        /* 参数表的首列通常是 flag，给出强调色 */
        tbody td:first-child {
            color: var(--accent);
            white-space: nowrap;
        }
        tbody tr:last-child td {
            border-bottom: 0;
        }

        /* ---------- 引用 = 旁注 ---------- */
        blockquote {
            margin-left: 0;
            margin-right: 0;
            padding: 0.55rem 1rem 0.55rem 1.1rem;
            border-left: 2px solid var(--accent-dim);
            background-color: var(--surface);
            color: var(--fg-muted);
            border-radius: 0 6px 6px 0;
        }
        blockquote p:first-child { margin-top: 0; }
        blockquote p:last-child { margin-bottom: 0; }

        hr {
            height: 1px;
            margin: 2.6rem 0;
            border: 0;
            background-image: linear-gradient(
                90deg,
                transparent,
                var(--rule-strong) 15%,
                var(--rule-strong) 85%,
                transparent
            );
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 1.4rem auto;
            border: 1px solid var(--rule);
            border-radius: 6px;
        }

        .colophon {
            margin-top: 3.5rem;
            padding-top: 0.9rem;
            border-top: 1px solid var(--rule);
            font-family: var(--font-display);
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--fg-muted);
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        /* ---------- 入场：一次编排好的载入，而非零散微动效 ---------- */
        @media (prefers-reduced-motion: no-preference) {
            .rail,
            .sheet > * {
                animation: rise 0.42s cubic-bezier(0.22, 0.68, 0.16, 1) both;
            }
            .sheet > *:nth-child(1) { animation-delay: 0.04s; }
            .sheet > *:nth-child(2) { animation-delay: 0.08s; }
            .sheet > *:nth-child(3) { animation-delay: 0.12s; }
            .sheet > *:nth-child(4) { animation-delay: 0.16s; }
            .sheet > *:nth-child(5) { animation-delay: 0.2s; }
            .sheet > *:nth-child(6) { animation-delay: 0.24s; }
            .sheet > *:nth-child(7) { animation-delay: 0.28s; }
            .sheet > *:nth-child(8) { animation-delay: 0.32s; }
            .sheet > *:nth-child(9) { animation-delay: 0.36s; }
            .sheet > *:nth-child(10) { animation-delay: 0.4s; }
            .sheet > *:nth-child(11) { animation-delay: 0.44s; }
            .sheet > *:nth-child(12) { animation-delay: 0.48s; }
            .sheet > *:nth-child(13) { animation-delay: 0.52s; }
            .sheet > *:nth-child(n + 14) { animation-delay: 0.56s; }
        }
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(0.6rem);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ---------- 窄屏：书脊栏改为顶部横条 ---------- */
        @media (max-width: 860px) {
            body {
                grid-template-columns: minmax(0, 1fr);
                gap: 1.25rem 0;
            }
            .rail {
                position: static;
                flex-direction: row;
                align-items: center;
                gap: 0.85rem;
                min-height: 0;
                padding: 0 0 0.85rem;
                border-right: 0;
                border-bottom: 1px solid var(--rule);
            }
            .rail__cmd {
                writing-mode: horizontal-tb;
                max-height: none;
                overflow: visible;
                font-size: 0.78rem;
            }
            .rail__meta {
                margin-top: 0;
                margin-left: auto;
            }
            .sheet {
                max-width: none;
            }
            h1 { font-size: 1.45rem; }
            pre { padding: 2.5rem 0.9rem 0.9rem; }
        }

        /* ---------- 打印：去掉外壳，回到纸面 ---------- */
        @media print {
            :root {
                --bg: #ffffff;
                --surface: #ffffff;
                --surface-2: #f2efe8;
                --fg: #000000;
                --fg-muted: #444444;
                --accent: #7a3f00;
                --accent-dim: #7a3f00;
                --link: #000000;
                --rule: #cccccc;
                --rule-strong: #999999;
                --rail-glow: transparent;
                --grid-line: transparent;
                --shadow: transparent;
                --shadow-soft: transparent;
                --zebra: #f7f6f2;
                --hover: transparent;
                --tok-str: #2f5220;
                --tok-var: #0b4a47;
                --tok-kw: #6a2f7a;
                --tok-num: #7a4406;
            }
            body {
                display: block;
                padding: 0;
                background-image: none;
                font-size: 10.5pt;
            }
            .rail,
            .colophon {
                display: none;
            }
            .sheet {
                max-width: none;
            }
            pre,
            blockquote,
            table,
            img {
                break-inside: avoid;
            }
            h1, h2, h3 {
                break-after: avoid;
            }
            .rail,
            .sheet > * {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <aside class="rail" aria-hidden="true">
        <div class="rail__brand">gg</div>
        <div class="rail__cmd">{{command}}</div>
        <div class="rail__meta">{{lang}}</div>
    </aside>
    <main class="sheet">
{{body}}
        <footer class="colophon">
            <span>{{command}}</span>
            <span>gg · man for your own notes</span>
        </footer>
    </main>
</body>
</html>
